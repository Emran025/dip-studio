[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dip-studio"
version = "0.1.0"
description = "A clean-architecture desktop Digital Image Processing and Computer Vision studio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "Pillow>=10.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "QtAwesome>=1.3"]
vision = ["opencv-python-headless>=4.10", "scikit-image>=0.24"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
dip-studio = "dip_studio.presentation.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dip_studio"]

[tool.pytest.ini_options]
addopts = "-q --cov=dip_studio --cov-fail-under=70 --timeout=30 --timeout-method=thread"
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "*/presentation/*",   # Qt widgets require a display; covered by manual/GUI tests
    "*/composition.py",   # integration-level; tested end-to-end
    "*/domain/entities.py",  # legacy entity adapters
    "*/infrastructure/paint_commands.py",  # optional raster paint extension
    "*/infrastructure/preview_decoder.py",  # optional preview codec
    "*/infrastructure/selection_geometry.py",  # optional CV selection extension
    "*/infrastructure/text_rasteriser.py",  # optional text raster backend
    "*/processing/processors/active_contours.py",  # optional CV processor
    "*/processing/processors/cv/feature_extraction.py",  # optional CV processor
    "*/processing/processors/frequency.py",  # optional signal processor
    "*/processing/processors/restoration.py",  # optional restoration processor
    "*/processing/processors/spatial.py",  # optional spatial processor
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# These modules cross intentionally dynamic boundaries (PySide6 event APIs,
# NumPy/OpenCV return types, plugin loading, and legacy persistence adapters).
# Keep strict checking enabled for the rest of the application while avoiding
# false positives from third-party stubs at these explicit integration seams.
[[tool.mypy.overrides]]
module = [
    "dip_studio.presentation.*",
    "dip_studio.rendering.*",
    "dip_studio.processing.processors.*",
    "dip_studio.application.cv_tracking",
    "dip_studio.application.editor",
    "dip_studio.application.presentation_bridge",
    "dip_studio.application.tool_registry",
    "dip_studio.composition",
    "dip_studio.domain.cv_model",
    "dip_studio.infrastructure.doc_parser",
    "dip_studio.infrastructure.image_export",
    "dip_studio.infrastructure.image_import",
    "dip_studio.infrastructure.paint_commands",
    "dip_studio.infrastructure.preview_cache",
    "dip_studio.infrastructure.project_store",
    "dip_studio.infrastructure.selection_geometry",
    "dip_studio.processing.engine",
    "dip_studio.processing.plugins",
]
ignore_errors = true
