[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dip-studio"
version = "0.1.0"
description = "A clean-architecture desktop Digital Image Processing and Computer Vision studio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/dip_studio"]

[tool.pytest.ini_options]
addopts = "-q --cov=dip_studio --cov-fail-under=80"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
