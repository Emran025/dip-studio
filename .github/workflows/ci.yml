name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[gui,dev]'
      - run: python .agent/scripts/architecture_guard.py
      - run: ruff check .
      - run: mypy src
      - run: pytest
