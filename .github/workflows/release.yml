name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Qt runtime libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui,vision]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --no-cov

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dip-studio-windows
            package: DIP-Studio-Setup.exe
          - os: macos-latest
            artifact: dip-studio-macos
            package: DIP-Studio-macos.dmg
          - os: ubuntu-latest
            artifact: dip-studio-linux
            package: DIP-Studio-linux.AppImage
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Qt runtime libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install packaged application dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[gui,vision]" pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean dip_studio.spec
      - name: Smoke-test packaged executable (Linux)
        if: runner.os == 'Linux'
        run: timeout 15s env QT_QPA_PLATFORM=offscreen ./dist/DIP-Studio || test $? -eq 124
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc "/DMyAppVersion=${{ github.ref_name }}" installer/DIP-Studio.iss
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname "DIP Studio" -srcfolder dist/DIP-Studio -ov -format UDZO "${{ matrix.package }}"
      - name: Install AppImage tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimage/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimage/appimagetool.AppImage"
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p dist/DIP-Studio.AppDir/usr/bin dist/DIP-Studio.AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/DIP-Studio dist/DIP-Studio.AppDir/usr/bin/DIP-Studio
          cp src/dip_studio/assets/DIP-Studio.ico dist/DIP-Studio.AppDir/usr/share/icons/hicolor/256x256/apps/DIP-Studio.ico
          cat > dist/DIP-Studio.AppDir/DIP-Studio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DIP Studio
          Exec=DIP-Studio
          Icon=DIP-Studio
          Categories=Graphics;2DGraphics;
          Terminal=false
          EOF
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/DIP-Studio" "$@"\n' > dist/DIP-Studio.AppDir/AppRun
          chmod +x dist/DIP-Studio.AppDir/AppRun
          "$RUNNER_TEMP/appimage/appimagetool.AppImage" dist/DIP-Studio.AppDir "${{ matrix.package }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package == 'DIP-Studio-Setup.exe' && 'dist/installer/DIP-Studio-Setup.exe' || matrix.package }}
          if-no-files-found: error
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package == 'DIP-Studio-Setup.exe' && 'dist/installer/DIP-Studio-Setup.exe' || matrix.package }}
          generate_release_notes: true
          fail_on_unmatched_files: true
